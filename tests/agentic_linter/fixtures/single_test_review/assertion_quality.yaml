# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

extra_assertion_proves_other_behavior:
  file_docstring: |
    """Provide shared context.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        Adding positive numbers returns a positive result.

        Verification Method: verify public function output

        Verification Detail:
        The result is positive.
        """

        a = 1
        b = 2
        c = add_2_positive_numbers(a, b)
        assert c > 0
        assert c == a + b
  expected_scorecard:
    51: # Assertions Prove the Stated Requirement
      fail # Exact addition is outside the stated positive-result requirement.

tagged_input_assertions:
  file_docstring: |
    """Provide shared context.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        Adding positive numbers returns a positive result.

        Verification Method: verify public function output

        Verification Detail:
        The result is positive.
        """

        a = 1
        b = 2
        c = add_2_positive_numbers(a, b)
        assert a > 0  # Input check
        assert b > 0  # Input check
        assert c > 0
  expected_scorecard:
    52: # Input Checks Are Tagged
      pass # Both input-validation assertions use the exact `# Input check` comment.

untagged_input_assertions:
  file_docstring: |
    """Provide shared context.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        Adding positive numbers returns a positive result.

        Verification Method: verify public function output

        Verification Detail:
        The result is positive.
        """

        a = 1
        b = 2
        c = add_2_positive_numbers(a, b)
        assert a > 0
        assert b > 0
        assert c > 0
  expected_scorecard:
    52: # Input Checks Are Tagged
      fail # The input-validation assertions omit the exact `# Input check` comment.
