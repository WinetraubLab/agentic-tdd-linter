per_source_test_pairing_is_unstated:
  file_docstring: |
    """Verify source-module API and test-file structure.

    Terms:
    - `source module`: A source module is a non-`__init__.py` Python file under src/agentic_tdd_linter. For example, src/agentic_tdd_linter/cli/main.py is a source module.
    - `test module`: A test module is a test_*.py file under tests. For example, tests/cli/test_main.py is a test module.
    """
  test: |
    def test_repository_modules_have_test_files(self) -> None:
        """Test Path: happy path

        Requirement Tested:
        A `source module` requires a `test module`.
        Standard usage: The scenario demonstrates baseline behavior.

        Verification Method: verify private function output

        Verification Detail:
        `_missing_test_paths` produces `[]`.

        Similar Coverage:
        - Other test: `test_source_module_structure.py::test_rejects_module_without_test_file`
          Relative level: lower than this test
        """

        repo_root = Path(__file__).resolve().parents[2]
        package_root = repo_root / "src" / "agentic_tdd_linter"
        test_root = repo_root / "tests"
        self.assertEqual(
            [],
            _missing_test_paths(
                package_root=package_root,
                test_root=test_root,
            ),
        )
  expected_scorecard:
    12: # Second Sentence Describes a Scenario
      pass # The standard-usage sentence uses the exact baseline-behavior classification.
    13: # Requirement Is Specific
      fail # The requirement does not say that every source module needs its own corresponding test module.
    51: # Assertions Prove the Stated Requirement
      fail # The assertion enforces one matching test path for every source module, while the requirement says only that a source module requires some test module.
