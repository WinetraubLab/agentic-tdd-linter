# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

defined_distinctive_file_terms:
  file_docstring: |
    """Verify module-name pairing.

    Terms:
    - `unit module`: A unit module is a test file that validates one implementation. For example, `test_parser.py` validates `parser.py`.
    - `implementation module`: An implementation module is code exercised by one unit module. For example, `parser.py` is exercised by `test_parser.py`.
    """
  test: |
    def test_maps_module_name() -> None:
        """Test Path: happy path

        Requirement Tested:
        A `unit module` identifies an `implementation module`.
        Standard usage: Callers provide their default values when they invoke the name mapper.

        Verification Method: verify public function output

        Verification Detail:
        Removing `test_` from `test_parser.py` produces `parser.py`.
        """

        assert "test_parser.py".removeprefix("test_") == "parser.py"
  expected_scorecard:
    46: # Terms Reuse Shared Vocabulary
      pass # Unit module and implementation module name different roles, so neither term duplicates the other.

interchangeable_file_terms:
  file_docstring: |
    """Verify module-name pairing.

    A `source module` is a Python file.
    For example, `parser.py` is a source module.

    An `implementation module` is a Python file.
    For example, `parser.py` is an implementation module.
    """
  test: |
    def test_maps_module_name() -> None:
        """Test Path: happy path

        Requirement Tested:
        `Source modules` identify implementations.
        When files use matching basenames, source modules identify implementations.

        Verification Method: verify public function output

        Verification Detail:
        The basename equals `parser.py`.
        """

        assert "parser.py" == "parser.py"
  expected_scorecard:
    46: # Terms Reuse Shared Vocabulary
      fail # Implementation module duplicates source module, so the requirement should reuse source module.
