record_field_set_forms_one_schema_contract:
  file_docstring: |
    """Verify extracted-test records.

    Terms:
    - `ExtractedTestRecord`: ExtractedTestRecord is the shared data structure for one indexed test. For example, it stores a test's path, name, line, syntax node, documentation, and source without a language discriminator.
    """
  test: |
    def test_stores_all_fields_without_language(self) -> None:
            """Test Path: happy path

            Requirement Tested:
            `ExtractedTestRecord` stores path, name, line, syntax node, test docstring, source text, and file docstring fields without a language field.
            Standard usage: The scenario demonstrates baseline behavior.

            Verification Method: verify public function output

            Verification Detail:
            The record exposes `tests/test_sample.py` as its path.
            The record exposes `test_sample` as its name.
            The record exposes `1` as its line.
            The record exposes `None` as its node.
            The record exposes `Sample documentation.` as its docstring.
            The record exposes `def test_sample(): pass` as its source.
            The record exposes `None` as its file docstring.
            The record omits `language`.
            """

            record = ExtractedTestRecord(
                path=Path("tests/test_sample.py"),
                name="test_sample",
                line=1,
                node=None,
                docstring="Sample documentation.",
                source="def test_sample(): pass",
            )

            self.assertEqual(Path("tests/test_sample.py"), record.path)
            self.assertEqual("test_sample", record.name)
            self.assertEqual(1, record.line)
            self.assertIsNone(record.node)
            self.assertEqual("Sample documentation.", record.docstring)
            self.assertEqual("def test_sample(): pass", record.source)
            self.assertIsNone(record.file_docstring)
            self.assertFalse(hasattr(record, "language"))
  expected_scorecard:
    14: # Requirement Is Atomic
      pass # The listed fields collectively define one complete record-schema contract.
    51: # Assertions Prove the Stated Requirement
      pass # Each field assertion proves one property named by the record-schema requirement.

module_identity_is_described_as_check_behavior:
  file_docstring: |
    """Verify deterministic module-docstring checks.

    Terms:
    - `check`: The check validates module-docstring placement in one test file. For example, it accepts a file whose first statement is a string literal.
    """
  test: |
    def test_missing_file_docstring_identifies_module(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        When files omit docstrings, the `check` identifies module scope.
        Specialized usage: For module-scope validation, docstring input becomes absent (instead of leading).

        Verification Method: verify public function output

        Verification Detail:
        Issue name is `<module>`.

        Similar Coverage:
        - Higher Level Test: `test_run_lint_pipeline.py::test_reports_missing_file_docstring`
          Justification: Deeper coverage — This test verifies `<module>`. Pipeline output omits identity.
        """

        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            test_file = root / "tests" / "test_sample.py"
            test_file.parent.mkdir()
            test_file.write_text(
                "def test_sample():\n    assert True\n",
                encoding="utf-8",
            )

            issues = check_test_file_docstring(test_file, root)

        self.assertEqual(["<module>"], [issue.test_name for issue in issues])
  expected_scorecard:
    15: # Requirement Begins with the Behavior Owner
      fail # The first sentence begins with a When scenario and makes the check, rather than the issue, own the behavior.
    51: # Assertions Prove the Stated Requirement
      fail # The assertion establishes the issue-name relationship that Requirement Tested omits.

repository_policy_described_as_git_query_requirement:
  file_docstring: |
    """Verify that agent-review manifests remain tracked.

    Terms:
    - `review manifest`: A review manifest is the tracked proof file for repository test reviews. For example, `tests/agentic_review_manifest.jsonl` is a review manifest.
    - `tracked-file query`: A tracked-file query runs `git ls-files --error-unmatch` for one repository path. For example, the query locates `tests/agentic_review_manifest.jsonl` in the Git index.
    """
  test: |
    def test_review_manifest_is_tracked(self) -> None:
        """Test Path: happy path

        Requirement Tested:
        `tracked-file query` locates `review manifest`.
        Standard usage: The scenario demonstrates baseline behavior.

        Verification Method: verify private function output

        Verification Detail:
        `_tracked_result` produces return code `0`.
        """

        repo_root = Path(__file__).resolve().parents[2]
        result = _tracked_result(
            Path("tests") / "agentic_review_manifest.jsonl",
            repo_root=repo_root,
        )

        self.assertEqual(0, result.returncode, result.stderr or result.stdout)
  expected_scorecard:
    15: # Requirement Begins with the Behavior Owner
      fail # The requirement makes the Git query responsible for behavior instead of stating the repository policy that the manifest remains tracked.
    44: # Wording Is Concrete
      fail # `locates` describes the inspection mechanism's outcome instead of the repository state that the manifest remains tracked in source control.

source_test_pairing_formulation_negative:
  file_docstring: |
    """Verify source-module API and test-file structure.

    Terms:
    - `source module`: A source module is a non-`__init__.py` Python file under src/agentic_tdd_linter. For example, tests/cli/test_main.py matches src/agentic_tdd_linter/cli/main.py.
    - `test module`: A test module is a test_*.py file under tests. For example, tests/cli/test_main.py is a test module.
    """
  test: |
    def test_rejects_module_without_test_file(self) -> None:
        """Test Path: failure path

        Requirement Tested:
        Repository validation propagates errors when `source module`s lack `test module`s.
        Specialized usage: For missing-test rejection, `test module` becomes absent (instead of present).

        Verification Method: verify private function output

        Verification Detail:
        Validation propagates `AssertionError`.

        Similar Coverage:
        - Higher Level Test: `test_source_module_structure.py::test_repository_modules_have_test_files`
          Justification: Diagnostic completeness — This test verifies missing-test assertion. Higher test verifies repository scan.
        """

        with tempfile.TemporaryDirectory() as directory:
            root = Path(directory)
            package_root = root / "src" / "agentic_tdd_linter"
            test_root = root / "tests"
            source = package_root / "agentic_linter" / "orphan.py"
            source.parent.mkdir(parents=True)
            source.write_text("VALUE = 1\n", encoding="utf-8")
            test_root.mkdir()

            with self.assertRaises(AssertionError):
                _assert_modules_have_matching_test_files(
                    package_root=package_root,
                    test_root=test_root,
                )
  expected_scorecard:
    12: # Second Sentence Describes a Scenario
      fail # The sentence presents an existing missing-match condition as a specialized input transition instead of directly stating the failure scenario.
    44: # Wording Is Concrete
      fail # The requirement describes error propagation instead of the repository policy that every source module requires a matching test module.

