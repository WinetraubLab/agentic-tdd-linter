unused_context_without_scenario:
  file_docstring: |
    """Provide shared context.

    For example, this file contains one test function.
    """
  test: |
    def test_rejects_unused_context_variable() -> None:
        """Test Path: failure path

        Requirement Tested:
        Jinja manifest rendering rejects context variables unused by the source template.

        Verification Method: verify public function output

        Verification Detail:
        Error report names unused context variable.
        """

        source_template = "Hello {{ name }}"
        manifest_context = {"name": "Ada", "unused_title": "Dr"}
        errors = validate_manifest_render(source_template, manifest_context)

        assert "unused_title" in errors
  expected_scorecard:
    12: # Second Sentence Describes a Scenario
      fail # Requirement Tested contains no second sentence describing a concrete unused-context scenario.

version_equality_described_as_identification:
  file_docstring: |
    """Tests for package version metadata.

    Terms:
    - `__version__`: This package attribute exposes the installed linter version. For example, it equals the version declared in pyproject.toml.
    """
  test: |
    def test_matches_package_metadata(self) -> None:
        """Test Path: happy path

        Requirement Tested:
        Package metadata identifies `__version__`.
        Standard usage: Callers use default inputs.

        Verification Method: verify private function output

        Verification Detail:
        `_project_version` produces `__version__`.
        """

        repo_root = Path(__file__).resolve().parents[1]
        project_version = _project_version(repo_root / "pyproject.toml")

        self.assertEqual(project_version, __version__)
  expected_scorecard:
    44: # Wording Is Concrete
      fail # Identifies is vague because it does not state the equality invariant proved by the test.
    51: # Assertions Prove the Stated Requirement
      fail # The assertion compares two version values, while the requirement claims only that metadata identifies one attribute.
           # Expected requirement: The package version exposed at runtime equals the project metadata version read by `_project_version`.
