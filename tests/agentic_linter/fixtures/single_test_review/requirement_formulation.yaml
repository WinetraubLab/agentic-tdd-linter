    """Verify the repository's unit-test workflow configuration.

    Terms:
    - `workflow`: The workflow is `.github/workflows/unit-tests.yml`, which runs the complete Python test suite. For example, it executes unittest discovery under the tests directory for pushes and pull requests.
    - `repository events`: Repository events are pushes and pull requests on any branch. For example, either event triggers the workflow.
    """
  test: |
    def test_unit_workflow_runs_tests(self) -> None:
            """Test Path: happy path

            Requirement Tested:
            The `workflow` executes Python tests.
            Standard usage: The scenario demonstrates baseline behavior.

            Verification Method: verify private function output

            Verification Detail:
            `_repository_test_workflow` output contains `python -m unittest discover -s tests`.
            """

            repo_root = Path(__file__).resolve().parents[2]
            workflow = _repository_test_workflow(repo_root)
            self.assertIn("python -m unittest discover -s tests", workflow)
  expected_scorecard:
    11: # First Sentence Describes Behavior
