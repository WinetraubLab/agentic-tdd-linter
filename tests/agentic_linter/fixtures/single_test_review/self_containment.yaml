# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

self_containment_001_external_expected_value:
  file_docstring: |
    """Tests in this file validate `fun_a` located at `src/examples/fun_a.py`.
    `fun_a` is responsible for computing numeric results.

    For example, this file contains one test function.
    """
  test: |
    def test_expected_value() -> None:
        """Test Path: failure path

        Requirement Tested:
        `fun_a` returns the expected value for ten.

        Verification Method: verify public function output

        Verification Detail:
        Linter report includes Test Values Are Local.
        """

        expected_value = EXPECTED_VALUE
        assert(fun_a(10), expected_value)
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Numeric return values belong to fun_a's computation responsibility.
    53: # Test Values Are Local
      fail # The expected result comes from `EXPECTED_VALUE` outside the test body.

