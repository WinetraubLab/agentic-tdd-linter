self_containment_003_imported_fact_list:
  file_docstring: |
    """Tests in this file validate `fact_update_policy` located at `src/examples/fact_update_policy.py`.
    `fact_update_policy` is responsible for governing updates to externally owned facts.

    For example, this file contains one test function.
    """
  test: |
    from ice_cream_database import ARTIFACT_BACKED_FACTS


    def test_artifact_backed_facts_cannot_update_directly() -> None:
        """Test Path: failure path

        Requirement Tested:
        `fact_update_policy` rejects direct updates for facts whose source of truth is another database.

        Verification Method: verify public function output

        Verification Detail:
        Loop checks artifact-backed facts return update rejection errors.
        """

        for fact_name in ARTIFACT_BACKED_FACTS:
            error = direct_fact_update_error(fact_name)

            self.assertIn("artifact_db_update", error)
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Direct-update rejection belongs to fact-update policy.
    53: # Test Values Are Local
      fail # Loop inputs come from the imported `ARTIFACT_BACKED_FACTS` list.

