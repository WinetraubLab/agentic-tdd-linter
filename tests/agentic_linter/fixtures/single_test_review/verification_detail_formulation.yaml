# Test-source examples for agent review.
# Each example contains only `file_docstring`, `test`, and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

verification_names_mechanics_only:
  file_docstring: |
    """Tests in this file validate `calculator` located at `src/examples/calculator.py`.
    `calculator` is responsible for arithmetic calculations.

    For example, this file contains one test function.
    """
  test: |
    def test_adds_numbers() -> None:
        """Test Path: happy path

        Requirement Tested:
        `calculator` produces a positive result when adding two numbers.

        Verification Method: verify public function output

        Verification Detail:
        by running the check command with a pass artifact and asserting success.
        """

        assert 1 + 1 > 0
  expected_scorecard:
    16: # Requirement Fits Declared Module Responsibility
      pass # Positive arithmetic results belong to the calculator.
    22: # Verification Detail Describes Evidence
      fail # The detail names command and assertion mechanics without behavior evidence.

