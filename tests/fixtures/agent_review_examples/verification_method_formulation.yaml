            """Test Path: happy path

            Requirement Tested:
            Linter accepts happy path as a valid test path classification.

            Verification Method: verify public function output

            Verification Detail:
            by asserting a test docstring using `happy path` produces no lint issues.
            """

            rules = _lint_classification_source(_source_with_classification(test_path="happy path"))

            self.assertEqual(set(), rules)
  expected_scorecard:
