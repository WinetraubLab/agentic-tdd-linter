# Test-source examples for agent review.
# Each example contains only `test` and `expected_scorecard`.
# Criteria omitted from `expected_scorecard` are ignored during comparison.
# Criterion comments must match their titles in `single_test_review.agent.md.j2`.
# Each outcome must be `pass` or `fail` followed by an explanation comment.

external_expected_value:
  test: |
    def test_expected_value() -> None:
        """Test Path: failure path

        Requirement Tested:
        Function `fun_a` returns the expected value for ten.

        Verification Method: verify public function output

        Verification Detail:
        Linter report includes Keep Assertions Self-Contained.
        """

        expected_value = EXPECTED_VALUE
        assert(fun_a(10), expected_value)
  expected_scorecard:
    53: # Assertions Are Self-Contained
      fail # The expected result comes from `EXPECTED_VALUE` outside the test body.

external_argument_value:
  test: |
    def test_argument_value() -> None:
        """Test Path: failure path

        Requirement Tested:
        Function `fun_a` returns ten for the provided value.

        Verification Method: verify public function output

        Verification Detail:
        Linter report includes Keep Assertions Self-Contained.
        """

        assert(fun_a(EXPECTED_VALUE), 10)
  expected_scorecard:
    53: # Assertions Are Self-Contained
      fail # The function input comes from `EXPECTED_VALUE` outside the test body.

imported_fact_list:
  test: |
    from ice_cream_database import ARTIFACT_BACKED_FACTS


    def test_artifact_backed_facts_cannot_update_directly() -> None:
        """Test Path: failure path

        Requirement Tested:
        Reject direct updates for facts whose source of truth is another database.

        Verification Method: verify public function output

        Verification Detail:
        Loop checks artifact-backed facts return update rejection errors.
        """

        for fact_name in ARTIFACT_BACKED_FACTS:
            error = direct_fact_update_error(fact_name)

            self.assertIn("artifact_db_update", error)
  expected_scorecard:
    53: # Assertions Are Self-Contained
      fail # Loop inputs come from the imported `ARTIFACT_BACKED_FACTS` list.

