        """Test Path: happy path

        Requirement Tested:
        The input is normalized before validation.

        Verification Method: verify public function output

        Verification Detail:
        The result is positive.
        """

        assert 1 + 1 > 0
  expected_scorecard:
    43: # Data-Flow Terms Name an Owner
      fail # Input does not name the component or caller that owns it.

